# ================================================================
# GuardianShield 统一配置文件 (guardian_config.yaml)
# ================================================================
#
# 【重要说明】
# 本文件是 GuardianShield 系统的唯一策略配置文件，相当于一把"钥匙"。
# 系统会在每次启动时尝试读取本文件：
#   - 若读取成功：按本文件中的最新策略执行，读取后本文件会被自动删除
#   - 若未找到本文件：沿用上一次成功读取的策略（二进制缓存）
#   - 若从未读取过任何配置：使用系统内置默认策略
#
# 【使用方法】
# 1. 管理员编辑本文件，配置所需策略
# 2. 将本文件放入 C:\ProgramData\GuardianShield\config\ 目录
# 3. 重启 GuardianShield 服务，系统自动读取并生效
# 4. 读取完成后本文件会被自动删除，防止策略泄露
# 5. 如需更新策略，重复步骤 1-3
#
# 【安全须知】
# - 本文件包含敏感配置（密码哈希、加密密钥等），仅限管理员持有
# - 请勿将本文件存放在普通用户可访问的位置
# - 系统缓存文件已设置 ACL 权限保护，普通用户无法读取
#
# 版本: 3.3.0
#
# 【v3.3.0 变更摘要】
#   - 实现 FILE_MOVE 跨卷移动检测: ETW 回调中 CREATE+DELETE 事件关联（5 秒窗口）
#   - 新增 file_move_count / file_move_window_seconds 批量阈值（tier1/tier2）
#   - 注释 7 个未实装事件类型: FILE_READ, FILE_SET_INFO, PROCESS_INJECT,
#     PROCESS_DEBUG, NETWORK_CONNECT, NETWORK_SEND, NETWORK_RECV
#     — 从枚举、配置解析、默认响应、驱动头文件中移除
#   - 响应动作审计: 验证 LOG/ALERT_USER/TERMINATE/ENCRYPT/BLOCK 真实可用
#   - WIPE/LOCKDOWN 仅在 Tier 2 紧急协议中触发，单事件配置时被过滤
#   - 192 个单元测试全部通过（含 12 个新增动作审计测试）
#
# 【v3.2.0 变更摘要】
#   - 新增 BLOCK 响应动作: 内核级文件操作拦截（需 GuardFilter 驱动）
#   - FILE_RENAME/FILE_MOVE 默认启用 BLOCK（保护目录中的同卷移动被内核拦截）
#   - 修复 GuardianB 驱动连接使用错误端口名 (F1)
#   - 修复 GuardianB LoadProtectedPaths 不同步到驱动 (F2)
#   - 新增启动时白名单同步到驱动（Guardian 进程 + YAML 白名单进程）
#   - 驱动重连后自动恢复白名单 + BlockPolicy + 保护路径
#   - BLOCK+TERMINATE 互斥: 同时配置时自动剥离 TERMINATE（避免双重惩罚）
#   - 驱动未加载时 BLOCK 跳过（不降级为 TERMINATE）
#
# 【v3.1.0 变更摘要】
#   - 14 项功能正确性缺陷修复（检测逻辑/静默失败/配置/架构冗余/加密引擎）
#   - event_type 范围校验（GuardianA + GuardianB）
#   - GuardianB 完整检测对齐：文件类型过滤 + 事件去重 + failover 驱动读取
#   - Config::Validate 上限校验（window≤3600s, retention≤365d, timeout≤600s, threshold≤100000）
#   - LoadYaml 后自动 SaveToCache，防止配置丢失
#   - EncryptFile 原子写入（.gs.tmp → MoveFileExW → .gs）
#   - TerminateProcess 返回值验证 + WaitForSingleObject
#   - GuardianC 超时自动重启 + DriverReadThread 断连重连
#   - emergency_executor 死代码删除
#
# 【v2.5.0 变更摘要】
#   - ETW 事件采集已从 GuardianC 迁移至 GuardianA（SYSTEM 服务，权限已满足）
#   - ETW 生命周期管理：防御性清理、atomic 句柄、60 秒活性守护、自动恢复
#   - IPC 优化：SendToNode 互斥锁保护并发、tryConnect 超时 1x300ms（原 3x1000ms）
#   - 通知回退：IPC 通知失败时使用 MessageBeep 音效提示
#   - 托盘菜单：右键退出项已隐藏，新增文件管理面板、一键解锁 .gs 加密文件
#   - 一键解锁：DECRYPT_REQUEST/DECRYPT_RESPONSE IPC 消息，线程化执行
# ================================================================


# ================================================================
# 系统基础配置
# ================================================================
system:                  # 系统基础配置节
  # version: 配置文件版本号
  #   - 格式: 主版本.次版本.修订号（语义化版本）
  #   - 用于判断配置兼容性，版本不匹配时系统会发出警告
  version: "3.3.0"       # 配置文件版本号（语义化: 主版本.次版本.修订号）

  # config_version: 配置文件内部递增版本
  #   - 每次修改配置后应手动递增此数字
  #   - 【当前版本注意】此字段已被 YAML 解析器读取但代码未使用其值
  #     未来版本可能用于判断配置是否有更新
  #   - 取值范围: 正整数
  config_version: 3      # 每次修改配置后手动 +1（当前版本未使用，预留）

  # log_level: 日志记录级别
  #   - 控制系统输出的日志详细程度
  #   - 可选值: DEBUG（调试）| INFO（信息）| WARN（警告）| ERROR（错误）
  #   - 默认: INFO
  #   - 生产环境建议使用 INFO 或 WARN，排查问题时切换为 DEBUG
  log_level: INFO        # 日志级别: DEBUG / INFO / WARN / ERROR（生产环境推荐 INFO）

  # log_path: 日志文件存储目录
  #   - 系统会在此目录下按日期生成日志文件
  #   - 路径中的反斜杠需要双写（YAML 转义）
  #   - 默认: "C:\\ProgramData\\GuardianShield\\logs"
  log_path: "C:\\ProgramData\\GuardianShield\\logs"  # 日志存储目录（反斜杠需双写）


# ================================================================
# 威胁检测配置
#
# 【三层响应架构】
#
#   第一层：单事件响应 — 由下方 event_responses 配置驱动
#     可用动作: LOG, ALERT_USER, TERMINATE, ENCRYPT, BLOCK
#     BLOCK: 内核级拦截，在文件操作完成前阻止（需 GuardFilter 驱动运行）
#       - BLOCK 映射为 LEVEL_2 威胁等级（与 TERMINATE/ENCRYPT 同级）
#       - BLOCK+TERMINATE 互斥: 同时配置时自动剥离 TERMINATE（操作已被阻止，无需再杀进程）
#       - 驱动未加载时 BLOCK 跳过（不降级为 TERMINATE，仅记录警告日志）
#       - 跨卷移动(COPY+DELETE): 源文件 DELETE 被阻止，但目标 COPY 已完成
#         → 文件同时存在于两处（保护目录中原文件保留）
#     FILE_MOVE: 跨卷移动通过 CREATE+DELETE 事件关联检测（v3.3 实现）
#     WIPE 和 LOCKDOWN 仅由批量协议触发，配置在此处无效（自动过滤）
#     ENCRYPT 对触发事件的单个文件执行 AES-256-GCM 加密（默认不启用）
#
#   第二层：批量操作超过 tier1 阈值 → 保护协议（全目录加密，可恢复）
#   第三层：批量操作超过 tier2 阈值 → 紧急协议（加密+擦除，不可逆）
#   未授权设备启动 → 直接触发紧急协议（跳过 ALERT 阶段）
#
# 【行为说明】
#   - ETW EventId 11 (NameDelete) 不再视为文件删除，仅 EventId 17/18 触发
#   - PID ≤ 4 (System/System Idle Process) 的文件操作自动忽略
#   - 倒计时期间暂停所有事件处理（防止无差别终止进程）
#   - TERMINATE 精准终止最大贡献 PID（不批量杀进程）
#   - 事件队列上限 10000，溢出时丢弃最旧事件
#   - desktop.ini / Thumbs.db 硬编码排除
#   - explorer.exe/dwm.exe 等 11 个系统进程加入终止保护名单
#
detection:               # 威胁检测配置节
  # 单事件响应动作配置（第一层）
  # 可用动作: LOG, ALERT_USER, TERMINATE, ENCRYPT, BLOCK
  # WIPE 和 LOCKDOWN 仅由批量协议触发，此处配置无效
  # ENCRYPT 对触发事件的单个文件执行加密（默认不启用）
  # BLOCK 在内核层阻止操作（需 GuardFilter 驱动），驱动未加载时跳过（不降级为 TERMINATE）
  event_responses:
    # === 已实现事件类型（有 ETW/驱动事件源） ===
    FILE_CREATE:    [LOG]                          # 文件创建 — 仅记录日志
    FILE_WRITE:     [LOG, ALERT_USER]              # 文件写入/修改 — 记录 + 告警
    FILE_RENAME:    [LOG, ALERT_USER, BLOCK]       # 文件重命名/同卷移动 — 记录 + 告警 + 内核拦截
    FILE_DELETE:    [LOG, ALERT_USER]              # 文件删除 — 记录 + 告警
    FILE_MOVE:      [LOG, ALERT_USER]              # 文件跨卷移动（CREATE+DELETE 关联检测）— 记录 + 告警
    FILE_COMPRESS:  [LOG, ALERT_USER]              # 文件压缩（启发式检测）— 记录 + 告警
    FILE_NETWORK_TRANSFER: [LOG, ALERT_USER]       # 网络传输文件（启发式检测）— 记录 + 告警
    PROCESS_CREATE: [LOG]                          # 进程创建 — 仅记录日志
    PROC_TERMINATE: [LOG]                          # 进程终止 — 仅记录（v2.1 降级）
    DRIVER_LOAD:    [LOG]                          # 驱动加载 — 仅记录（v2.1 降级）
    DRIVER_UNLOAD:  [LOG]                          # 驱动卸载 — 仅记录（v2.1 降级）
    # === 以下事件类型当前版本无事件源，不实装 ===
    # FILE_READ:      [LOG]                        # 预留: ETW EventId 15 噪声太大，需智能过滤
    # FILE_SET_INFO:  [LOG, ALERT_USER]            # 预留: 需 minifilter IRP_MJ_SET_INFORMATION
    # PROCESS_INJECT: [LOG, ALERT_USER, TERMINATE] # 预留: 需 GuardMonitor 内核驱动
    # PROCESS_DEBUG:  [LOG, ALERT_USER, TERMINATE] # 预留: 需 GuardMonitor 内核驱动
    # NETWORK_CONNECT: [LOG, ALERT_USER]           # 预留: 需 WFP/ETW 网络 provider
    # NETWORK_SEND:   [LOG, ALERT_USER]            # 预留: 需 WFP 驱动
    # NETWORK_RECV:   [LOG, ALERT_USER]            # 预留: 需 WFP 驱动



  # thresholds: 两级批量操作检测阈值（被代码读取并生效）
  #
  # 三层响应架构：
  #   单事件 → 由 event_responses 配置驱动（LOG, ALERT_USER, TERMINATE, ENCRYPT, BLOCK）
  #   超过 tier1 → 保护协议：全目录加密（可恢复）
  #   超过 tier2 → 紧急协议：加密 + 擦除 + 删除 + 锁屏（不可逆）
  #   未授权设备启动 → 直接触发紧急协议（跳过 ALERT 阶段）
  #
  # 【留空规则】
  #   - 填写正整数: 按该阈值检测
  #   - 留空或设为 0: 不限制该类行为（跳过该项检测）
  #   - 删除该行或注释掉: 使用系统内置默认值
  #
  # alert_timeout_seconds — ALERT 阶段等待管理员取消的超时时间
  #   - 取值范围: 10-600（v3.1 Validate 上限校验），默认: 300
  alert_timeout_seconds: 300   # 单位: 秒（300秒 = 5分钟）；超时后自动升级到保护/紧急协议

  thresholds:              # 两级批量操作检测阈值
    # ---- Tier 1: 保护协议阈值（全目录加密，可恢复） ----
    # 滑动时间窗口内累计事件数达到阈值 → 触发保护协议
    # *_count: 事件计数阈值（v3.1 上限: 100000）  *_window_seconds: 滑动窗口长度（秒，v3.1 上限: 3600）
    tier1:                                        # 第一级阈值（触发保护协议，可恢复）
      file_write_count: 10                      # 文件写入次数阈值（非复制，仅 WriteFile 调用）
      file_write_window_seconds: 5              # 文件写入滑动窗口（秒）
      file_compress_count: 50                   # 文件压缩次数阈值（启发式：熵值突变检测）
      file_compress_window_seconds: 5           # 文件压缩滑动窗口（秒）
      file_delete_count: 5                      # 文件删除次数阈值
      file_delete_window_seconds: 5             # 文件删除滑动窗口（秒）
      file_create_count: 15                     # 文件创建次数阈值
      file_create_window_seconds: 5             # 文件创建滑动窗口（秒）
      file_rename_count: 10                     # 文件重命名/同卷移动次数阈值
      file_rename_window_seconds: 5             # 文件重命名滑动窗口（秒）
      file_move_count: 10                       # 文件跨卷移动次数阈值（CREATE+DELETE 关联检测）
      file_move_window_seconds: 5              # 文件跨卷移动滑动窗口（秒）
      file_network_transfer_count: 10           # 网络传输文件次数阈值
      file_network_transfer_window_seconds: 5   # 网络传输滑动窗口（秒）
      data_transfer_mb: 1                       # 累计网络传输数据量阈值（单位: MB）
      process_termination_count: 50             # 进程终止次数阈值（v2.1: 降级为 LEVEL_0/LOG，仅供统计参考）
      process_termination_window_seconds: 5      # 进程终止检测时间窗口（秒）

    # ---- Tier 2: 紧急协议阈值（加密 + 擦除 + 删除 + 锁屏，不可逆） ----
    # 滑动时间窗口内累计事件数达到阈值 → 触发紧急协议（无法撤销）
    tier2:                                         # 第二级阈值（触发紧急协议，不可逆）
      file_write_count: 50                       # 文件写入次数阈值（Tier2 > Tier1，表示更大规模攻击）
      file_write_window_seconds: 10              # 文件写入滑动窗口（秒）— 比 Tier1 窗口更宽
      file_compress_count: 250                   # 文件压缩次数阈值
      file_compress_window_seconds: 10           # 文件压缩滑动窗口（秒）
      file_delete_count: 20                      # 文件删除次数阈值
      file_delete_window_seconds: 10             # 文件删除滑动窗口（秒）
      file_create_count: 50                      # 文件创建次数阈值
      file_create_window_seconds: 10             # 文件创建滑动窗口（秒）
      file_rename_count: 50                      # 文件重命名/同卷移动次数阈值
      file_rename_window_seconds: 10             # 文件重命名滑动窗口（秒）
      file_move_count: 50                        # 文件跨卷移动次数阈值
      file_move_window_seconds: 10               # 文件跨卷移动滑动窗口（秒）
      file_network_transfer_count: 40            # 网络传输文件次数阈值
      file_network_transfer_window_seconds: 10   # 网络传输滑动窗口（秒）
      data_transfer_mb: 10                       # 累计网络传输数据量阈值（单位: MB）
      process_termination_count: 200             # 进程终止次数阈值（v2.1: 降级为 LEVEL_0/LOG，仅供统计参考）
      process_termination_window_seconds: 5      # 进程终止检测时间窗口（秒）


# ================================================================
# 保护目录配置
# ================================================================
protection:              # 保护目录配置节
  # directories: 需要保护的目录列表
  #   - 可配置多个目录，每个目录独立设置
  #   - path: 目录的绝对路径（反斜杠需双写）
  #   - recursive: 是否递归保护子目录
  #       true = 保护该目录及所有子目录中的文件
  #       false = 仅保护该目录下的直接文件
  #   - priority: 保护优先级
  #       HIGH = 高优先级，检测到异常立即响应
  #       MEDIUM = 中优先级
  #       LOW = 低优先级，仅记录日志
  directories:            # 受保护目录列表（可配置多个，每个独立设置）
    - path: "C:\\Users\\Administrator\\Documents\\test"  # 受保护目录的绝对路径（反斜杠需双写）
      recursive: true                                     # true=递归保护所有子目录 / false=仅保护当前目录
      priority: HIGH                                      # 保护优先级: HIGH=立即响应 / MEDIUM=中等 / LOW=仅记录

  # file_types: 文件类型过滤器
  #   - include: 需要保护的文件扩展名（通配符匹配）
  #     仅匹配这些类型的文件会被监控
  #   - exclude: 排除的文件扩展名
  #     这些类型的文件即使在保护目录中也不会被监控
  #   - 提示: 如果 include 为空，则保护所有文件类型
  file_types:
    include: []       # 需保护的扩展名列表（空=保护所有类型）；示例: ["*.docx", "*.xlsx"]
    exclude:          # 排除的扩展名列表（即使在保护目录中也不监控）
      - "*.obj"       # 编译中间文件
      - "*.pdb"       # 调试符号文件
      - "*.log"       # 日志文件
      - "*.tmp"       # 临时文件
      - "*.bak"       # 备份文件
      - "*.cache"     # 缓存文件
      - "*.etl"       # ETW 跟踪文件
      - "*.dmp"       # 崩溃转储
      - "*.suo"       # VS 用户选项
      - "*.ncb"       # IntelliSense 缓存
      - "*.sdf"       # SQL Server CE 数据库
      - "*.opensdf"   # VS 浏览数据库
      - "Thumbs.db"   # Windows 缩略图缓存
      - "desktop.ini" # 文件夹配置


# ================================================================
# 环境授权配置
# ================================================================
authorization:           # 环境授权配置节
  # list_path: 授权设备清单文件路径
  #   - 包含允许运行本系统的 IP/MAC 地址列表
  #   - 系统启动时校验当前设备是否在授权清单中
  #   - 未授权设备将触发紧急协议
  #   - 默认: "C:\\ProgramData\\GuardianShield\\config\\auth.list"
  list_path: "C:\\ProgramData\\GuardianShield\\config\\auth.list"  # 授权设备清单文件路径（含 IP/MAC 列表）

  # check_on_boot: 是否在每次启动时校验环境
  #   - true = 每次启动都验证 IP/MAC（推荐）
  #   - false = 跳过环境校验
  #   - 默认: true
  check_on_boot: true    # true=每次启动验证设备合法性 / false=跳过校验

  # strict_mode: 严格模式
  #   - true = 未授权设备直接触发最高等级处置（紧急协议）
  #   - false = 未授权设备仅记录告警，不触发紧急协议
  #   - 默认: true（生产环境强烈建议开启）
  strict_mode: true      # true=未授权设备触发紧急协议 / false=仅告警不触发


# ================================================================
# 日志配置
# ================================================================
logging:                 # 日志配置节
  # path: 日志文件存储路径
  #   - 与 system.log_path 功能相同，此处为日志模块专用配置
  #   - 【注意】代码实际读取 system.log_path，此字段作为冗余保留
  #   - 默认: "C:\\ProgramData\\GuardianShield\\logs"
  path: "C:\\ProgramData\\GuardianShield\\logs"  # 日志文件存储目录（冗余: 代码读取 system.log_path）

  # format: 日志输出格式
  #   - 可选值: json | text
  #   - json: 结构化 JSON 格式，便于日志分析工具解析
  #   - text: 纯文本格式，便于人工阅读
  #   - 默认: json
  format: json             # json=结构化输出（便于工具解析）/ text=纯文本（便于人工阅读）

  # retention_days: 日志保留天数
  #   - 超过此天数的旧日志文件会被自动清理
  #   - 取值范围: 1-365（v3.1 Validate 上限校验），默认: 7
  retention_days: 7        # 单位: 天；超期日志自动清理

  # daily_rotation: 是否按天轮转日志文件
  #   - true = 每天生成一个新的日志文件（推荐）
  #   - false = 所有日志写入同一文件
  #   - 默认: true
  daily_rotation: true     # true=每天创建新日志文件 / false=写入同一文件


# ================================================================
# 管理员配置（敏感，仅管理员可修改）
# ================================================================
#
# 【密码与密钥说明】
# - password_hash 用于紧急协议锁屏后的解锁验证（GuardianC 锁屏界面输入）
# - install_key_hash 用于安装/卸载服务时的身份验证
# - 两者均为 SHA-256 哈希，格式为 64 位小写十六进制字符串
#
# 【默认密码/密钥（未配置 hash 时生效）】
#   - 默认解锁密码:  GuardianShield2026!
#   - 默认安装密钥:  GuardianShield2026!
#   - 【安全警告】生产环境必须更换默认密码和密钥！
#
# 【哈希生成方法】
#   方法一 — 使用项目自带工具（推荐）:
#     cd GuardianShield\tools
#     python hash_tool.py --text "你的密码"
#
#   方法二 — PowerShell:
#     [System.BitConverter]::ToString(
#       [System.Security.Cryptography.SHA256]::Create().ComputeHash(
#         [System.Text.Encoding]::UTF8.GetBytes('你的密码')
#       )
#     ).Replace('-','').ToLower()
#
admin:                   # 管理员配置节（敏感，仅管理员可修改）
  # password_hash: 管理员解锁密码的 SHA-256 哈希值
  #   - 紧急协议触发后，系统进入 LOCKED 状态，GuardianC 弹出锁屏界面
  #   - 管理员在该界面输入密码，系统计算 SHA-256 后与此值比对
  #   - 验证通过则解除紧急状态，恢复 NORMAL
  #   - 留空或删除此字段: 使用内置默认密码 GuardianShield2026!
  #   - 格式: 64 位小写十六进制字符串
  password_hash: "9fa5a1127819b0ec6ab6bfdacbc62ffe2a9cd3d1faf7f2db7df7fcc369e5d3df"  # 解锁密码的 SHA-256 哈希（64位小写十六进制）

  # install_key_hash: 安装/卸载密钥的 SHA-256 哈希值
  #   - 安装（MSI 安装向导 / svchost_core.exe -install）和
  #     卸载（uninstall.bat / svchost_core.exe -uninstall）时均需验证
  #   - 留空或删除此字段: 使用内置默认密钥 GuardianShield2026!
  #   - 格式: 64 位小写十六进制字符串
  install_key_hash: "9fa5a1127819b0ec6ab6bfdacbc62ffe2a9cd3d1faf7f2db7df7fcc369e5d3df"  # 安装密钥的 SHA-256 哈希（64位小写十六进制）

  # unlock_timeout_seconds: 锁屏等待超时时间（秒）
  #   - 系统进入 LOCKED 状态后，管理员需在此时间内输入解锁密码
  #   - 超时未解锁: 系统将继续执行剩余的紧急协议步骤（擦除/删除）
  #   - 取值范围: 10-3600，默认: 30
  unlock_timeout_seconds: 30  # 单位: 秒；LOCKED 状态下管理员解锁等待时限


# ================================================================
# 进程白名单配置
# ================================================================
whitelist:               # 进程白名单配置节
  # processes: 允许访问保护目录的进程列表
  #   - 白名单中的进程对保护文件的操作不会触发告警
  #   - name: 进程可执行文件名（不含路径，不区分大小写）
  #   - description: 进程描述（仅用于注释，不影响匹配）
  #   - permissions: 允许的操作权限列表
  #       READ = 允许读取保护文件
  #       WRITE = 允许修改保护文件
  #   - conditions: （可选）附加条件
  #       user: 仅当指定用户/用户组运行该进程时白名单生效
  #   - 【安全提示】白名单应尽量精简，仅添加必需的开发工具
  #
  #   【v2.1 UWP 支持】
  #   Windows 11 的 UWP 应用（如新版记事本 Notepad.exe）其 ETW 路径为
  #   WindowsApps\microsoft.windowsnotepad_...\Notepad\Notepad.exe。
  #   系统已内置 UWP 回退逻辑：当 ETW 路径无法直接提取 .exe 名时，
  #   会自动通过 QueryFullProcessImageNameW 获取真实进程名再匹配白名单。
  #   因此只需在此填写 "Notepad.exe" 即可同时覆盖经典版和 UWP 版。
  processes:               # 白名单进程列表
    - name: "devenv.exe"              # 进程名（不含路径，不区分大小写）
      description: "Visual Studio IDE" # 描述信息（仅注释用途，不影响匹配逻辑）
      permissions: [READ, WRITE]       # 允许的操作: READ=读取 / WRITE=修改保护文件

    - name: "code.exe"                # Visual Studio Code 主进程
      description: "Visual Studio Code"  # 描述信息（仅注释用途）
      permissions: [READ, WRITE]       # 允许读写保护目录

    - name: "notepad.exe"             # Windows 记事本（经典版 + UWP 版均可匹配）
      description: "Windows Notepad"   # 描述信息（仅注释用途）
      permissions: [READ, WRITE]       # 允许读写保护目录

    - name: "idea64.exe"              # JetBrains IntelliJ IDEA 64位主进程
      description: "IntelliJ IDEA"     # 描述信息（仅注释用途）
      permissions: [READ, WRITE]       # 允许读写保护目录

    - name: "git.exe"                 # Git 版本控制命令行工具
      description: "Git 版本控制工具"    # 描述信息（仅注释用途）
      permissions: [READ]             # 仅允许读取（禁止 Git 直接修改保护文件）

    - name: "powershell.exe"          # Windows PowerShell 命令行
      description: "Windows PowerShell"  # 描述信息（仅注释用途）
      permissions: [READ]             # 仅允许读取
      conditions:                     # 附加条件（可选）
        - user: "Administrators"      # 仅管理员组运行时白名单生效


# ================================================================
# 紧急协议配置（高度敏感，仅管理员可修改）
# ================================================================
#
# 【紧急协议状态机】
# 当检测到严重威胁（网络传输、批量操作超阈值、进程被终止超阈值等）时，
# 系统按以下状态流自动推进：
#
#   NORMAL  ──触发──>  ALERT  ──超时──>  ENCRYPTING  ──完成──>  WIPING  ──完成──>  DELETING  ──完成──>  LOCKED
#     ^                  |
#     |                  | (管理员在 ALERT 阶段取消)
#     +------------------+
#
#   1. NORMAL   — 正常监控状态
#   2. ALERT    — 警报状态，等待管理员介入
#                  持续时间由 detection.alert_timeout_seconds 控制（默认 30 秒）
#                  v2.1: 倒计时期间 m_protocolActive=true，暂停所有事件处理，
#                  防止在此窗口内无差别终止无辜进程
#   3. ENCRYPTING — 使用 AES-256-GCM 加密保护目录中的文件
#   4. WIPING   — 按 wipe_method 安全擦除已加密的原始文件
#   5. DELETING — 清理临时文件和元数据
#   6. LOCKED   — 系统锁定，GuardianC 弹出全屏锁屏界面
#
# 【如何解除紧急协议（恢复到 NORMAL）】
#   - 在 ALERT 阶段: GuardianC 控制面板中点击"取消紧急状态"，直接恢复
#   - 在 LOCKED 阶段: 在 GuardianC 锁屏界面输入管理员解锁密码
#     (见上方 admin.password_hash 配置，默认密码: GuardianShield2026!)
#   - 在 ENCRYPTING/WIPING/DELETING 阶段: 无法中断，必须等到 LOCKED 后解锁
#
# 【注意事项】
#   - 解锁后被加密的文件会使用缓存密钥自动解密还原
#   - 已被擦除（WIPING 完成）的文件无法恢复
#   - 因此在 ALERT 阶段及时取消至关重要
#   - v2.1: Tier-2 紧急协议仅精准终止事件贡献最多的进程 PID，
#     explorer.exe/dwm.exe 等核心系统进程受保护不会被终止
#
emergency:               # 紧急协议配置节（高度敏感，仅管理员可修改）
  # encrypt_timeout_seconds: 保留字段（当前版本未使用）
  #   - 设计意图: 控制触发紧急协议后 ALERT → ENCRYPTING 的等待时间
  #   - 【当前版本注意】此配置值已被解析但未被代码调用
  #     实际 ALERT 等待时间由 detection.alert_timeout_seconds 控制（默认 30 秒）
  #     未来版本可能启用此字段作为独立控制
  #   - 取值范围: 5-600（v3.1 Validate 上限校验），默认: 30
  encrypt_timeout_seconds: 30    # 单位: 秒；保留字段（当前由 detection.alert_timeout_seconds 控制）

  # recovery_wait_seconds: 保留字段（当前版本未使用）
  #   - 设计意图: 加密完成后额外等待管理员介入的时间
  #   - 【当前版本注意】此参数在代码中未被读取，加密完成后直接进入 WIPING
  #     未来版本可能启用
  #   - 取值范围: 10-3600，默认: 30
  recovery_wait_seconds: 30      # 单位: 秒；保留字段（当前版本未使用，加密后直接进入 WIPING）

  # wipe_method: 安全擦除算法
  #   - 决定 WIPING 阶段对原始文件的覆写方式
  #   - 可选值:
  #       DOD_5220 = 美国国防部 DoD 5220.22-M 标准（7 次覆写: 0x00/0xFF/随机/0x00/0xFF/随机/0x00）
  #       GUTMANN = Gutmann 方法（35 次覆写，最安全但最慢）
  #       SIMPLE = 简单覆写（1 次零填充，速度最快）
  #   - 默认: DOD_5220（安全性与速度的平衡选择）
  wipe_method: DOD_5220          # 擦除算法: DOD_5220(7次覆写) / GUTMANN(35次) / SIMPLE(1次零填充)

  # notifications: 紧急事件通知渠道
  #   - 进入 ALERT 状态时，系统通过配置的渠道发送通知
  #   - type: 通知类型
  #       EMAIL = 邮件通知
  #       WEBHOOK = HTTP Webhook 通知
  #   - recipients: 邮件接收地址列表（EMAIL 类型）
  #   - url: Webhook 回调地址（WEBHOOK 类型）
  #   - 提示: 可同时配置多个通知渠道
  notifications:           # 紧急事件通知渠道列表
    - type: EMAIL                                        # 通知类型: EMAIL=邮件通知
      recipients:                                        # 邮件接收人列表（可配置多个）
        - "security@company.com"                         # 安全团队邮箱地址
    - type: WEBHOOK                                      # 通知类型: WEBHOOK=HTTP 回调通知
      url: "https://alert.company.com/api/incident"      # Webhook 回调地址（POST 请求）


# ================================================================
# 进程间通信配置
# ================================================================
communication:           # 进程间通信（IPC）配置节（【注意】当前版本代码未解析此节，IPC 参数为硬编码）
  # named_pipe: 命名管道通信
  #   - GuardianA/B/C 之间通过命名管道交换心跳和事件
  #   - enabled: 是否启用（true/false），默认: true
  #   - timeout_ms: 管道读写超时时间（毫秒）
  #     取值范围: 1000-30000，默认: 5000
  named_pipe:              # 命名管道通信（GuardianA/B/C 之间的心跳和事件交换）
    enabled: true       # true=启用命名管道通信 / false=禁用
    timeout_ms: 5000    # 管道读写超时（单位: 毫秒）；范围 1000-30000

  # shared_memory: 共享内存通信
  #   - 用于 Guardian 组件之间的高速状态同步
  #   - enabled: 是否启用（true/false），默认: true
  #   - size_kb: 共享内存大小（KB）
  #     取值范围: 1-64，默认: 4
  shared_memory:           # 共享内存通信（高速状态同步）
    enabled: true       # true=启用共享内存 / false=禁用
    size_kb: 4          # 共享内存大小（单位: KB）；范围 1-64

  # tcp: TCP 网络通信
  #   - 用于远程管理或跨主机 Guardian 节点通信
  #   - enabled: 是否启用（true/false），默认: true
  #   - port_base: 通信端口基址
  #     GuardianA 使用 port_base, GuardianB 使用 port_base+1, 以此类推
  #     取值范围: 1024-65500，默认: 17500
  #   - tls: 是否启用 TLS 加密
  #     【当前版本注意】TLS 尚未实现，代码会将此值强制设为 false 并记录警告日志
  #     true = 预留（未来版本实现后生效）
  #     false = 明文通信（当前唯一可用模式）
  tcp:                     # TCP 网络通信（远程管理 / 跨主机节点通信）
    enabled: true       # true=启用 TCP 网络通信 / false=禁用
    port_base: 17500    # 端口基址（A=17500, B=17501, C=17502）；范围 1024-65500
    tls: false          # 【当前版本】TLS 未实现，强制明文；未来版本实现后可改为 true


# ================================================================
# 密钥与加密配置（高度敏感，仅管理员可修改）
# ================================================================
keys:                    # 密钥与加密配置节（【注意】当前版本代码未解析此节，加密算法为硬编码 AES-256-GCM/CBC）
  # tpm: 可信平台模块配置
  #   - 使用 TPM 硬件安全模块保护加密密钥
  #   - enabled: 是否启用 TPM（true/false）
  #     如果主机没有 TPM 芯片，请设为 false
  #     默认: true
  #   - pcr_indices: TPM PCR（平台配置寄存器）索引列表
  #     用于绑定系统启动状态，防止在不同启动环境下解密
  #     取值范围: 0-23 的整数数组
  #     默认: [0, 1, 2, 3, 4, 5, 6, 7]
  tpm:                     # 可信平台模块（TPM）配置
    enabled: true                              # true=启用 TPM 硬件密钥保护 / false=禁用（无 TPM 芯片时设为 false）
    pcr_indices: [0, 1, 2, 3, 4, 5, 6, 7]     # TPM PCR 寄存器索引列表（绑定启动状态）；范围 0-23

  # encryption: 文件加密配置
  #   - algorithm: 加密算法
  #       可选值: AES-256-GCM | AES-256-CBC | ChaCha20-Poly1305
  #       默认: AES-256-GCM（推荐，支持认证加密）
  #   - key_rotation_days: 密钥轮换周期（天）
  #       系统每隔此天数自动更换加密密钥
  #       取值范围: 1-365，默认: 30
  encryption:              # 文件加密配置
    algorithm: AES-256-GCM      # 加密算法: AES-256-GCM(推荐) / AES-256-CBC / ChaCha20-Poly1305
    key_rotation_days: 30        # 密钥自动轮换周期（单位: 天）；范围 1-365
